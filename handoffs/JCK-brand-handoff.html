document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Nivoda — Conference brand handoff<\u002Ftitle>\n<style>/* ============================================================\n   Conference brand handoff — stylesheet\n   Dark-first, brand-compliant, single document\n   ============================================================ */\n\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 100 900;\n  font-display: swap;\n  src: url(\"c7501c05-0c35-4f38-9e7c-241f51c3b805\") format('woff2-variations');\n}\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 100 800;\n  font-display: swap;\n  src: url(\"f5692181-e1db-4ab7-bf46-cbbf64eba153\") format('woff2-variations');\n}\n@font-face {\n  font-family: 'Nanum Myeongjo';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"c10ae526-f12d-48b0-9a9a-1c655cea8d55\") format('woff2');\n}\n@font-face {\n  font-family: 'Nanum Myeongjo';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fe17e9f5-0f06-4b8f-91a1-42e6e43ae3fa\") format('woff2');\n}\n\n:root {\n  --violet-50:#f4f2ff; --violet-100:#e9e8ff; --violet-600:#6330f5; --violet-700:#5620e1;\n  --stone-50:#fafaf9; --stone-100:#f5f5f4; --stone-200:#e7e5e4; --stone-300:#d6d3d1;\n  --stone-400:#a8a29e; --stone-500:#78716c; --stone-600:#57534e; --stone-700:#44403c;\n  --stone-800:#292524; --stone-900:#1c1917; --stone-950:#0c0a09;\n  --green-600:#479570; --red-600:#dc2626; --amber-600:#d97706; --blue-600:#1e4cf5;\n\n  --grad-stone-atmosphere:\n    radial-gradient(ellipse 90% 70% at 18% 18%, rgba(120, 113, 108, 0.32), transparent 80%),\n    radial-gradient(ellipse 85% 65% at 82% 82%, rgba(68, 64, 60, 0.4), transparent 80%),\n    linear-gradient(135deg, #1c1917, #0c0a09 75%);\n\n  --bg-deep: var(--stone-950);\n  --bg-surface: var(--stone-900);\n  --bg-elevated: var(--stone-800);\n  --fg-primary: var(--stone-50);\n  --fg-secondary: var(--stone-400);\n  --fg-tertiary: var(--stone-500);\n  --border: var(--stone-700);\n  --border-strong: var(--stone-400);\n  --accent: #ffffff;\n\n  --font-serif: 'Nanum Myeongjo', 'Times New Roman', serif;\n  --font-sans:  'Inter', system-ui, sans-serif;\n  --font-mono:  'JetBrains Mono', ui-monospace, monospace;\n}\n\n[data-ctx=\"light\"], .light-ctx {\n  --bg-deep: #ffffff;\n  --bg-surface: #ffffff;\n  --bg-elevated: var(--stone-50);\n  --fg-primary: var(--stone-950);\n  --fg-secondary: var(--stone-600);\n  --fg-tertiary: var(--stone-500);\n  --border: var(--stone-200);\n  --border-strong: var(--violet-600);\n  --accent: var(--violet-600);\n}\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; }\nbody.doc {\n  background: var(--stone-950);\n  color: var(--stone-50);\n  font-family: var(--font-sans);\n  font-size: 16px;\n  line-height: 1.5;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nimg { max-width: 100%; display: block; }\ncode { font-family: var(--font-mono); font-size: 0.9em; }\nem { font-style: italic; }\n\n/* ====== layout shell ====== */\n.sidebar {\n  position: fixed;\n  inset: 0 auto 0 0;\n  width: 280px;\n  padding: 40px 32px;\n  background: var(--stone-950);\n  border-right: 1px solid var(--stone-800);\n  display: flex; flex-direction: column;\n  z-index: 10;\n  overflow-y: auto;\n}\n.sb-brand { display:block; margin-bottom: 32px; }\n.sb-brand img { width: 110px; }\n.sb-meta { margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--stone-800); }\n.sb-eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #9886ff; font-weight: 500; margin-bottom: 8px; }\n.sb-title { font-family: var(--font-serif); font-size: 20px; line-height: 1.25; color: var(--stone-50); }\n.sb-rev { margin-top: 12px; font-size: 12px; color: #9886ff; font-family: var(--font-mono); text-transform: uppercase; }\n.sb-nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }\n.sb-nav a {\n  display: block;\n  padding: 8px 0;\n  font-size: 13px;\n  color: var(--stone-400);\n  text-decoration: none;\n  border-bottom: 1px solid transparent;\n  transition: color 0.2s ease;\n}\n.sb-nav a:hover { color: #9886ff; }\n.sb-nav a.is-active { color: #ffffff; }\n.sb-foot { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--stone-800); font-size: 12px; color: var(--stone-500); }\n.sb-foot p { margin: 0 0 6px; }\n.sb-foot-name { color: var(--stone-300); font-weight: 500; }\n\n.main {\n  margin-left: 280px;\n}\n\n/* ====== cover ====== */\n.cover {\n  position: relative;\n  padding: 120px 96px 96px;\n  min-height: 720px;\n  background: var(--stone-950);\n  overflow: hidden;\n  border-bottom: 1px solid var(--stone-800);\n}\n.cover-inner { max-width: 880px; position: relative; z-index: 2; }\n.cover-eyebrow {\n  display: inline-flex; align-items: center; gap: 10px;\n  font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;\n  font-weight: 500; margin-bottom: 48px;\n}\n.cover-eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: #9886ff; }\n.cover-eyebrow { color: #9886ff; }\n.cover-title {\n  font-family: var(--font-serif);\n  font-size: 96px;\n  line-height: 1.02;\n  font-weight: 400;\n  letter-spacing: -0.025em;\n  margin: 0 0 40px;\n  color: var(--stone-50);\n}\n.cover-title em { font-style: italic; font-weight: 400; color: #9886ff; display: block; margin-top: 4px; }\n.cover-lede {\n  font-size: 20px;\n  line-height: 1.625;\n  color: var(--stone-300);\n  max-width: 640px;\n  margin: 0 0 80px;\n}\n.cover-grid {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 48px;\n  padding-top: 48px;\n  border-top: 1px solid var(--stone-800);\n}\n.kv-label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--stone-500); font-weight: 500; margin-bottom: 8px; }\n.kv-value { font-size: 14px; color: var(--stone-200); line-height: 1.4; }\n\n.cover-mark {\n  position: absolute;\n  right: -60px;\n  top: 50%;\n  transform: translateY(-50%);\n  width: 480px; height: 480px;\n  opacity: 0.04;\n  z-index: 1;\n}\n.cover-mark img { width: 100%; height: 100%; }\n\n/* ====== sections ====== */\n.sec {\n  padding: 120px 96px;\n  background: var(--bg-deep);\n  color: var(--fg-primary);\n  border-bottom: 1px solid var(--border);\n}\n.sec.light-ctx { background: #ffffff; color: var(--stone-950); border-bottom: 1px solid var(--stone-200); }\n\n.sec-head { max-width: 880px; margin: 0 0 64px; position: relative; }\n.sec-num {\n  font-family: var(--font-mono);\n  font-size: 12px;\n  letter-spacing: 0.1em;\n  color: var(--fg-tertiary);\n  margin-bottom: 16px;\n  text-transform: uppercase;\n}\n.sec-h {\n  font-family: var(--font-serif);\n  font-size: 64px;\n  font-weight: 400;\n  line-height: 1.08;\n  letter-spacing: -0.02em;\n  margin: 0 0 20px;\n  color: var(--fg-primary);\n}\n.sec-h em { font-style: italic; font-weight: 400; color: #9886ff; }\n.light-ctx .sec-h em { color: var(--violet-600); }\n.sec-num { font-size: 14px; }\n.sec-sub {\n  font-size: 18px;\n  line-height: 1.625;\n  color: var(--fg-secondary);\n  max-width: 720px;\n  margin: 0;\n}\n\n.lede { font-size: 18px; line-height: 1.625; color: var(--fg-primary); }\n.two-col {\n  display: grid;\n  grid-template-columns: 1.3fr 1fr;\n  gap: 64px;\n  align-items: start;\n}\n\n/* brief */\n.brief-checklist {\n  background: var(--stone-50);\n  border: 1px solid var(--stone-200);\n  border-radius: 2px;\n  padding: 32px;\n}\n.brief-checklist .cl-title {\n  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;\n  color: var(--stone-500); margin-bottom: 20px; font-weight: 500;\n}\n.brief-checklist ol {\n  margin: 0; padding: 0; list-style: none;\n  counter-reset: cl;\n}\n.brief-checklist li {\n  counter-increment: cl;\n  padding: 12px 0 12px 36px;\n  position: relative;\n  border-top: 1px solid var(--stone-200);\n  font-size: 15px; line-height: e-900);\n  border: 1px solid var(--stone-700);\n  border-radius: 2px;\n  padding: 32px;\n}\n.deliv-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }\n.deliv-num {\n  width: 36px; height: 36px;\n  border: 1px solid var(--stone-700);\n  border-radius: 999px;\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--font-mono); font-size: 12px; color: var(--stone-300);\n}\n.deliv h3 { font-family: var(--font-serif); font-size: 22px; font-weight: 400; margin: 0; color: var(--stone-50); }\n.deliv ul { margin: 0; padding-left: 0; list-style: none; }\n.deliv li {\n  font-size: 14px;\n  color: var(--stone-400);\n  line-height: 1.5;\n  padding: 10px 0 10px 16px;\n  border-top: 1px solid var(--stone-800);\n  position: relative;\n}\n.deliv li:first-child { border-top: 0; }\n.deliv li::before { content: '·'; position: absolute; left: 4px; top: 10px; color: var(--stone-500); }\n\n.timeline { border-top: 1px solid var(--stone-800); padding-top: 48px; }\n.timeline h3 { font-family: var(--font-serif); font-size: 24px; font-weight: 400; margin: 0 0 32px; color: var(--stone-50); }\n.tl { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 16px; }\n.tl li {\n  display: grid;\n  grid-template-columns: 120px 24px 1fr;\n  gap: 24px;\n  align-items: center;\n}\n.tl-day { font-family: var(--font-mono); font-size: 12px; color: var(--stone-400); text-transform: uppercase; }\n.tl-bar { height: 1px; background: #9886ff; }\n.tl-step { font-size: 15px; color: var(--stone-200); }\n\n/* ====== contact ====== */\n.contact-grid {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 24px;\n  margin-bottom: 64px;\n}\n.contact-card {\n  background: var(--stone-50);\n  border: 1px solid var(--stone-200);\n  border-radius: 2px;\n  padding: 32px;\n}\n.cc-eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--stone-500); font-weight: 500; margin-bottom: 16px; }\n.cc-name { font-family: var(--font-serif); font-size: 22px; font-weight: 400; color: var(--stone-950); margin-bottom: 4px; }\n.cc-role { font-size: 14px; color: var(--stone-600); margin-bottom: 8px; }\n.cc-meta { font-family: var(--font-mono); font-size: 12px; color: var(--stone-700); margin-bottom: 16px; font-weight: 500; }\n.contact-card p { font-size: 13px; color: var(--stone-600); line-height: 1.5; margin: 0; }\n\n.gap-note {\n  display: grid;\n  grid-template-columns: 64px 1fr;\n  gap: 24px;\n  background: var(--amber-50, #fffbeb);\n  border-left: 3px solid var(--amber-600);\n  padding: 32px;\n  border-radius: 2px;\n  margin-bottom: 64px;\n}\n.gap-mark {\n  width: 48px; height: 48px;\n  display: flex; align-items: center; justify-content: center;\n  background: var(--amber-600);\n  color: #ffffff;\n  font-family: var(--font-serif); font-size: 28px; font-weight: 700;\n  border-radius: 999px;\n}\n.gap-note h3 { font-family: var(--font-serif); font-size: 24px; font-weight: 400; margin: 0 0 12px; color: var(--stone-950); }\n.gap-note p { font-size: 15px; color: var(--stone-700); line-height: 1.625; margin: 0 0 16px; max-width: 720px; }\n.gap-note ul { margin: 0; padding-left: 20px; }\n.gap-note li { font-size: 14px; color: var(--stone-700); line-height: 1.625; margin-bottom: 6px; }\n\n.doc-foot {\n  display: flex; align-items: center; justify-content: space-between;\n  padding-top: 48px;\n  border-top: 1px solid var(--stone-200);\n  gap: 48px;\n}\n.df-l img { width: 120px; }\n.df-r p { font-size: 13px; color: var(--stone-600); margin: 0 0 4px; text-align: right; }\n.df-meta { font-family: var(--font-mono); font-size: 11px !important; color: var(--stone-500) !important; text-transform: uppercase; }\n\n/* responsive guard for narrow previews */\n@media (max-width: 1100px) {\n  .sidebar { width: 240px; padding: 32px 24px; }\n  .main { margin-left: 240px; }\n  .sec, .cover { padding-left: 56px; padding-right: 56px; }\n  .cover-title { font-size: 64px; }\n  .sec-h { font-size: 44px; }\n  .cover-grid { grid-template-columns: repeat(2, 1fr); }\n  .essence-grid, .img-grid, .status-grid, .contact-grid, .deliv-grid, .logo-grid, .logo-specs, .dodont-grid, .voice-grid, .vs-row, .tg-grid, .scrim-row, .terms-grid, .layout-grid, .never-list { grid-template-columns: 1fr 1fr; }\n  .app-stage--bifold, .bifold-spread { grid-template-columns: 1fr; }\n  .scale-row { grid-template-columns: repeat(11, 1fr); }\n}\n<\u002Fstyle>\n<\u002Fhead>\n\n<body class=\"doc\">\n\n<!-- ====== SIDE NAV ====== -->\n<aside class=\"sidebar\" aria-label=\"Document navigation\">\n  <a class=\"sb-brand\" href=\"#top\" aria-label=\"Nivoda — top of document\">\n    <img src=\"512ade26-8dc3-4b1b-9cc1-77e984ad55f7\" alt=\"Nivoda\">\n  <\u002Fa>\n  <div class=\"sb-meta\">\n    <div class=\"sb-eyebrow\" style=\"color: rgb(255, 255, 255)\">Brand handoff<\u002Fdiv>\n    <div class=\"sb-title\">For conference designers<\u002Fdiv>\n    <div class=\"sb-rev\" style=\"color: rgb(255, 255, 255)\">Rev 01 · April 2026<\u002Fdiv>\n  <\u002Fdiv>\n  <nav class=\"sb-nav\">\n    <a href=\"#brief\">01 · The brief<\u002Fa>\n    <a href=\"#essence\">02 · Brand essence<\u002Fa>\n    <a href=\"#logo\">03 · Logo<\u002Fa>\n    <a href=\"#color\">04 · Color<\u002Fa>\n    <a href=\"#type\">05 · Typography<\u002Fa>\n    <a href=\"#layout\">06 · Layout &amp; spacing<\u002Fa>\n    <a href=\"#voice\">07 · Voice &amp; copy<\u002Fa>\n    <a href=\"#applications\">08 · Applications<\u002Fa>\n    <a href=\"#donts\">09 · Don't, ever<\u002Fa>\n    <a href=\"#deliverables\">10 · Deliverables &amp; specs<\u002Fa>\n    <a href=\"#contact\">11 · Contact &amp; assets<\u002Fa>\n  <\u002Fnav>\n  <div class=\"sb-foot\">\n    <p>Brand owner<\u002Fp>\n    <p class=\"sb-foot-name\">Chris Learey<br>Design Lead, Nivoda<\u002Fp>\n  <\u002Fdiv>\n<\u002Faside>\n\n<!-- ====== MAIN ====== -->\n<main class=\"main\" id=\"top\">\n\n<!-- COVER -->\n<section class=\"cover\">\n  <div class=\"cover-inner\">\n    <div class=\"cover-eyebrow\">\n      <span class=\"dot\" style=\"background-color: rgb(255, 255, 255)\"><\u002Fspan>\n      <span style=\"color: rgb(255, 255, 255); font-family: &quot;JetBrains Mono&quot;\">Brand handoff · External<\u002Fspan>\n    <\u002Fdiv>\n    <h1 class=\"cover-title\">Designing for Nivoda<em>at the trade floor<\u002Fem><\u002Fh1>\n    <p class=\"cover-lede\">A working brief for the event designer producing banners, signage, print and stand graphics for Nivoda's presence at JCK and other industry conferences. Read this end-to-end before opening a file.<\u002Fp>\n    <div class=\"cover-grid\">\n      <div>\n        <div class=\"kv-label\" style=\"color: rgb(120, 113, 108); font-family: &quot;JetBrains Mono&quot;\">Prepared for<\u002Fdiv>\n        <div class=\"kv-value\">External event &amp; print designer<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"kv-label\" style=\"font-family: &quot;JetBrains Mono&quot;\">Prepared by<\u002Fdiv>\n        <div class=\"kv-value\">Nivoda Brand, in partnership with Chris Learey<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"kv-label\" style=\"font-family: &quot;JetBrains Mono&quot;\">Reads in<\u002Fdiv>\n        <div class=\"kv-value\">~15 minutes<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"kv-label\" style=\"font-family: &quot;JetBrains Mono&quot;\">Status<\u002Fdiv>\n        <div class=\"kv-value\">Working document · v1.0<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"cover-mark\" aria-hidden=\"true\">\n    <img src=\"d94d0d23-dbda-4ebc-a11b-a3011696dd65\" alt=\"\">\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 01 BRIEF -->\n<section class=\"sec light-ctx\" id=\"brief\" data-sec=\"01\">\n  <div class=\"sec-head\">\n    <div class=\"sec-num\">01<\u002Fdiv>\n    <h2 class=\"sec-h\">The brief <em>in one page<\u002Fem><\u002Fh2>\n  <\u002Fdiv>\n  <div class=\"sec-body two-col\">\n    <div>\n      <p class=\"lede\">You are designing Nivoda's physical presence at industry conferences — most immediately JCK Las Vegas — across banners, signage, lanyards, printed collateral, stand graphics, and giveaways. The brand exists, the system is mature, and your job is to apply it with restraint and confidence in a context (a noisy trade floor) it was not originally drawn for.<\u002Fp>\n      <p>Nivoda is the global B2B marketplace for diamonds and jewelry. We connect independent jewelers with verified suppliers across 50+ countries. The audience on the floor is independent jewelers, suppliers, and operators who already know the category cold. They do not need to be sold the idea of diamonds — they need to feel that Nivoda is the serious, trustworthy partner who deserves their business.<\u002Fp>\n      <p>Read this entire document before sketching. The system is opinionated; freeform interpretation will miss.<\u002Fp>\n    <\u002Fdiv>\n    <aside class=\"brief-checklist\">\n      <div class=\"cl-title\">What we'll judge the work on<\u002Fdiv>\n      <ol>\n        <li>Does it look like Nivoda from across a hall?<\u002Fli>\n        <li>Would it sit comfortably next to a Cartier ad?<\u002Fli>\n        <li>Is the violet earned, or is it decorating?<\u002Fli>\n        <li>Would Chris recognize the typography hierarchy?<\u002Fli>\n        <li>Does the photography feel like real people, real trade?<\u002Fli>\n      <\u002Fol>\n    <\u002Faside>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 02 ESSENCE -->\n<section class=\"sec\" id=\"essence\" data-sec=\"02\">\n  <div class=\"sec-head\">\n    <div class=\"sec-num\">02<\u002Fdiv>\n    <h2 class=\"sec-h\">What the brand <em>actually feels like<\u002Fem><\u002Fh2>\n  <\u002Fdiv>\n\n  <div class=\"essence-grid\">\n    <article class=\"pillar\">\n      <div class=\"pillar-num\">i.<\u002Fdiv>\n      <h3>Human, local, relational<\u002Fh3>\n      <p>A century-old tradition of real people doing business with real people. Independent jewelers, family suppliers, hand-shake trust. Show this through warm photography of actual humans, never staged stock.<\u002Fp>\n    <\u002Farticle>\n    <article class=\"pillar\">\n      <div class=\"pillar-num\">ii.<\u002Fdiv>\n      <h3>Luxury marketplace<\u002Fh3>\n      <p>Fine jewelry deserves fine presentation. Restrained color. Generous whitespace. Display serif. Dark first. Closer to a boutique than a tech booth.<\u002Fp>\n    <\u002Farticle>\n    <article class=\"pillar\">\n      <div class=\"pillar-num\">iii.<\u002Fdiv>\n      <h3>Fintech backbone<\u002Fh3>\n      <p>A serious credit business runs underneath. Memo, terms, certified inventory. The work must convey reliability — clean grids, precise type, no ornament for ornament's sake.<\u002Fp>\n    <\u002Farticle>\n  <\u002Fdiv>\n\n  <div class=\"vibe-line\">\n    <p><em>Confident like a luxury boutique. Precise like a financial platform. Warm like the person behind the counter.<\u002Fem><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 03 LOGO -->\n<section class=\"sec\" id=\"logo\" data-sec=\"03\">\n  <div class=\"sec-head\">\n    <div class=\"sec-num\">03<\u002Fdiv>\n    <h2 class=\"sec-h\">The logo <em>and how to treat it<\u002Fem><\u002Fh2>\n    <p class=\"sec-sub\">Four canonical files. Use them as-shipped — do not redraw, recolor, or recreate. SVG for any vector application; request high-res PNG/EPS from brand if your printer needs it.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- variants -->\n  <div class=\"logo-grid\">\n    <figure class=\"logo-card dark\">\n      <div class=\"logo-stage\">\n        <img src=\"512ade26-8dc3-4b1b-9cc1-77e984ad55f7\" alt=\"Nivoda wordmark — white on dark\">\n      <\u002Fdiv>\n      <figcaption>\n        <div class=\"lc-name\">wordmark-white.svg<\u002Fdiv>\n        <div class=\"lc-use\">Default. Use on dark backgrounds and dark photography.<\u002Fdiv>\n      <\u002Ffigcaption>\n    <\u002Ffigure>\n    <figure class=\"logo-card light\">\n      <div class=\"logo-stage\">\n        <img src=\"b6db2296-0fc1-436b-8478-7d799102254a\" alt=\"Nivoda wordmark — black on light\">\n      <\u002Fdiv>\n      <figcaption>\n        <div class=\"lc-name\">wordmark-black.svg<\u002Fdiv>\n        <div class=\"lc-use\">Use on white, off-white, or light photography.<\u002Fdiv>\n      <\u002Ffigcaption>\n    <\u002Ffigure>\n    <figure class=\"logo-card dark\">\n      <div class=\"logo-stage logo-stage--icon\">\n        <img src=\"d94d0d23-dbda-4ebc-a11b-a3011696dd65\" alt=\"Nivoda icon — white on dark\">\n      <\u002Fdiv>\n      <figcaption>\n        <div class=\"lc-name\">icon-white.svg<\u002Fdiv>\n        <div class=\"lc-use\">Lapel pins, app tiles, lanyard cards, anywhere the wordmark would render below 40px / 1 inch wide.<\u002Fdiv>\n      <\u002Ffigcaption>\n    <\u002Ffigure>\n    <figure class=\"logo-card light\">\n      <div class=\"logo-stage logo-stage--icon\">\n        <img src=\"1714f500-31c8-4d15-acec-10353ffee68a\" alt=\"Nivoda icon — black on light\">\n      <\u002Fdiv>\n      <figcaption>\n        <div class=\"lc-name\">icon-black.svg<\u002Fdiv>\n        <div class=\"lc-use\">Same use as icon-white, on light surfaces.<\u002Fdiv>\n      <\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fdiv>\n\n  <!-- specs -->\n  <div class=\"logo-specs\">\n    <div class=\"spec\">\n      <div class=\"spec-label\" style=\"font-family: &quot;JetBrains Mono&quot;\">Clear space<\u002Fdiv>\n      <div class=\"spec-visual\">\n        <div class=\"cs-box\">\n          <span class=\"cs-axis cs-axis--top\">16px / ¼ height<\u002Fspan>\n          <span class=\"cs-axis cs-axis--left\">16px<\u002Fspan>\n          <span class=\"cs-axis cs-axis--right\">16px<\u002Fspan>\n          <span class=\"cs-axis cs-axis--bottom\">16px<\u002Fspan>\n          <img src=\"512ade26-8dc3-4b1b-9cc1-77e984ad55f7\" alt=\"\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"spec-note\">Minimum 16px on all sides, or one quarter of the logo's height — whichever is larger. Nothing in this zone. Not text, not borders, not adjacent logos.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spec\">\n      <div class=\"spec-label\" style=\"font-family: &quot;JetBrains Mono&quot;\">Minimum size<\u002Fdiv>\n      <div class=\"spec-table\">\n        <div class=\"st-row st-row--head\"><span>Application<\u002Fspan><span>Wordmark<\u002Fspan><span>Icon<\u002Fspan><\u002Fdiv>\n        <div class=\"st-row\"><span>Digital<\u002Fspan><span>40 px wide<\u002Fspan><span>24 px wide<\u002Fspan><\u002Fdiv>\n        <div class=\"st-row\"><span>Print<\u002Fspan><span>25 mm / 1 in<\u002Fspan><span>12 mm / 0.5 in<\u002Fspan><\u002Fdiv>\n        <div class=\"st-row\"><span>Large format<\u002Fspan><span>Use SVG, scale to brief<\u002Fspan><span>Use SVG, scale to brief<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"spec-note\">Below the digital minimum the wordmark loses legibility. Use the icon instead.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spec\">\n      <div class=\"spec-label\" style=\"font-family: &quot;JetBrains Mono&quot;\">Approved surfaces<\u002Fdiv>\n      <div class=\"surface-row\">\n        <div class=\"surface\" style=\"background:#0c0a09\"><span style=\"color:#fff\">Soft black · #0c0a09<\u002Fspan><\u002Fdiv>\n        <div class=\"surface\" style=\"background:#1c1917\"><span style=\"color:#fff\">Stone-900 · #1c1917<\u002Fspan><\u002Fdiv>\n        <div class=\"surface\" style=\"background:#ffffff\"><span style=\"color:#0c0a09\">White · #ffffff<\u002Fspan><\u002Fdiv>\n        <div class=\"surface\" style=\"background:#fafaf9\"><span style=\"color:#0c0a09\">Off-white · #fafaf9<\u002Fspan><\u002Fdiv>\n        <div class=\"surface surface--photo\"><span style=\"color:#fff\">Dark photography (with scrim)<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"spec-note\">No violet backgrounds behind the logo. No mid-tone grays. No colored photography unless heavily darkened.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- do/don't logo -->\n  <div class=\"dodont\">\n    <h3 class=\"dodont-h\">Logo — do &amp; don't<\u002Fh3>\n    <div class=\"dodont-grid\">\n      <div class=\"dd dd--do\"><div class=\"dd-stage\" style=\"background:#0c0a09\"><img src=\"512ade26-8dc3-4b1b-9cc1-77e984ad55f7\" alt=\"\"><\u002Fdiv><div class=\"dd-tag\">Do<\u002Fdiv><p>White wordmark on soft black, generous clear space.<\u002Fp><\u002Fdiv>\n      <div class=\"dd dd--dont\"><div class=\"dd-stage\" style=\"background:#6330f5\"><img src=\"512ade26-8dc3-4b1b-9cc1-77e984ad55f7\" alt=\"\"><\u002Fdiv><div class=\"dd-tag\">Don't<\u002Fdiv><p>Never place the logo on violet. Violet is never a background.<\u002Fp><\u002Fdiv>\n      <div class=\"dd dd--dont\"><div class=\"dd-stage\" style=\"background:#ffffff\"><img src=\"512ade26-8dc3-4b1b-9cc1-77e984ad55f7\" alt=\"\" style=\"filter:invert(38%) sepia(98%) saturate(4500%) hue-rotate(252deg) brightness(95%) contrast(102%)\"><\u002Fdiv><div class=\"dd-tag\">Don't<\u002Fdiv><p>Never recolour the logo. White and black files only.<\u002Fp><\u002Fdiv>\n      <div class=\"dd dd--dont\"><div class=\"dd-stage\" style=\"background:#0c0a09\"><img src=\"512ade26-8dc3-4b1b-9cc1-77e984ad55f7\" alt=\"\" style=\"transform:skew(-12deg) scaleX(1.15)\"><\u002Fdiv><div class=\"dd-tag\">Don't<\u002Fdiv><p>Never stretch, skew, or rotate.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 04 COLOR -->\n<section class=\"sec light-ctx\" id=\"color\" data-sec=\"04\">\n  <div class=\"sec-head\">\n    <div class=\"sec-num\">04<\u002Fdiv>\n    <h2 class=\"sec-h\">Color <em>used with restraint<\u002Fem><\u002Fh2>\n    <p class=\"sec-sub\">Two scales carry the brand: <strong>Violet<\u002Fstrong> (the accent) and <strong>Stone<\u002Fstrong> (warm neutrals). Four status colors exist for meaning, not decoration. The single most important rule on this page is the <strong>violet rule<\u002Fstrong> — read it before specifying anything.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- the violet rule -->\n  <div class=\"violet-rule\">\n    <div class=\"vr-mark\">!<\u002Fdiv>\n    <div>\n      <h3>The violet rule — brand &amp; print<\u002Fh3>\n      <p><strong>Violet shifts tier with the surface.<\u002Fstrong> On dark backgrounds, use the lighter <code>violet-400 (#9886ff)<\u002Fcode> — it sits cleanly on soft black and reads as a brand accent without vibrating. On light backgrounds, use the deeper <code>violet-600 (#6330f5)<\u002Fcode> — it has the contrast to anchor accents on white.<\u002Fp>\n      <p>The hard \"no violet on dark\" rule lives in <em>product UI only<\u002Fem> (where violet is reserved for hover states). For event collateral — banners, signage, print, stand graphics — you can use violet on both surfaces. Just always pick the tier that matches the surface.<\u002Fp>\n      <div class=\"vr-pair\">\n        <div class=\"vr-chip vr-chip--dark\">\n          <span class=\"vr-chip-label\">On dark<\u002Fspan>\n          <span class=\"vr-chip-sample\" style=\"color:#9886ff\">violet-400<\u002Fspan>\n          <span class=\"vr-chip-hex\">#9886ff<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"vr-chip vr-chip--light\">\n          <span class=\"vr-chip-label\">On light<\u002Fspan>\n          <span class=\"vr-chip-sample\" style=\"color:#6330f5\">violet-600<\u002Fspan>\n          <span class=\"vr-chip-hex\">#6330f5<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- violet scale -->\n  <div class=\"scale-block\">\n    <div class=\"scale-head\"><h3>Violet — brand<\u002Fh3><span class=\"scale-meta\">11 tiers · brand primary <code>violet-600 · #6330f5<\u002Fcode><\u002Fspan><\u002Fdiv>\n    <div class=\"scale-row\" id=\"violet-scale\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- stone scale -->\n  <div class=\"scale-block\">\n    <div class=\"scale-head\"><h3>Stone — neutrals<\u002Fh3><span class=\"scale-meta\">Warm grey, never cool grey · soft black <code>stone-950 · #0c0a09<\u002Fcode><\u002Fspan><\u002Fdiv>\n    <div class=\"scale-row\" id=\"stone-scale\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- status -->\n  <div class=\"status-block\">\n    <div class=\"scale-head\"><h3>Status colors<\u002Fh3><span class=\"scale-meta\">Use only for meaning — confirmation, error, warning, info.<\u002Fspan><\u002Fdiv>\n    <div class=\"status-grid\">\n      <div class=\"stat\" style=\"--c:#479570\"><span class=\"stat-sw\"><\u002Fspan><div><strong>Green · success<\u002Fstrong><br><code>#479570<\u002Fcode><\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\" style=\"--c:#dc2626\"><span class=\"stat-sw\"><\u002Fspan><div><strong>Red · error<\u002Fstrong><br><code>#dc2626<\u002Fcode><\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\" style=\"--c:#d97706\"><span class=\"stat-sw\"><\u002Fspan><div><strong>Amber · warning<\u002Fstrong><br><code>#d97706<\u002Fcode><\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\" style=\"--c:#1e4cf5\"><span class=\"stat-sw\"><\u002Fspan><div><strong>Blue · info<\u002Fstrong><br><code>#1e4cf5<\u002Fcode><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- print conversion -->\n  <div class=\"print-conv\">\n    <h3>For print — color conversions<\u002Fh3>\n    <p>Convert from sRGB hex to your printer's profile. These are reference CMYK / Pantone equivalents; always pull a proof before signing off a large run.<\u002Fp>\n    <table class=\"conv-table\">\n      <thead><tr><th>Token<\u002Fth><th>Hex<\u002Fth><th>CMYK (approx)<\u002Fth><th>Pantone (closest)<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td>violet-600 — primary, on light<\u002Ftd><td>#6330f5<\u002Ftd><td>78 / 86 / 0 / 0<\u002Ftd><td>2725 C<\u002Ftd><\u002Ftr>\n        <tr><td>violet-400 — accent, on dark<\u002Ftd><td>#9886ff<\u002Ftd><td>40 / 50 / 0 / 0<\u002Ftd><td>2715 C<\u002Ftd><\u002Ftr>\n        <tr><td>violet-50 — tint<\u002Ftd><td>#f4f2ff<\u002Ftd><td>3 / 4 / 0 / 0<\u002Ftd><td>2705 C (10%)<\u002Ftd><\u002Ftr>\n        <tr><td>stone-950 — soft black<\u002Ftd><td>#0c0a09<\u002Ftd><td>70 / 65 / 65 / 90<\u002Ftd><td>Black 6 C / Pantone Black<\u002Ftd><\u002Ftr>\n        <tr><td>stone-50 — off-white<\u002Ftd><td>#fafaf9<\u002Ftd><td>1 / 1 / 2 / 0<\u002Ftd><td>Warm Gray 1 C (5%)<\u002Ftd><\u002Ftr>\n        <tr><td>stone-600 — secondary text<\u002Ftd><td>#57534e<\u002Ftd><td>56 / 53 / 60 / 56<\u002Ftd><td>Warm Gray 11 C<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n    <p class=\"caveat\">Conversions are calculated from the sRGB profile and are <em>indicative<\u002Fem>. For brand-critical applications (large banners, exhibition walls), Chris will sign off a printed proof.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 05 TYPE -->\n<section class=\"sec\" id=\"type\" data-sec=\"05\">\n  <div class=\"sec-head\">\n    <div class=\"sec-num\">05<\u002Fdiv>\n    <h2 class=\"sec-h\">Typography <em>set with intent<\u002Fem><\u002Fh2>\n    <p class=\"sec-sub\">Two families. Four weights. A fixed scale. No exceptions — including for \"just this one banner.\"<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- families -->\n  <div class=\"type-families\">\n    <div class=\"tf\">\n      <div class=\"tf-eyebrow\" style=\"font-family: &quot;JetBrains Mono&quot;\">Display · headlines only<\u002Fdiv>\n      <div class=\"tf-name\" style=\"font-family:'Nanum Myeongjo',serif;color:#ffffff;\">Nanum Myeongjo<\u002Fdiv>\n      <div class=\"tf-spec\"><span>Weights: 400 · 700<\u002Fspan><span>Italic: yes<\u002Fspan><span>License: OFL<\u002Fspan><\u002Fdiv>\n      <p>A Korean serif with formal elegance. It carries the warmth and luxury pillar. Use it for headlines, title slabs, and the largest words on a banner. <strong>Never<\u002Fstrong> for body, captions, or UI.<\u002Fp>\n      <div class=\"tf-sample\" style=\"font-family:'Nanum Myeongjo',serif;\">\n        <div style=\"font-size:84px;line-height:1.1;font-weight:400;letter-spacing:-0.015em\">The marketplace<br><em style=\"color: rgb(152, 134, 255)\">trusted by jewelers.<\u002Fem><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"tf\">\n      <div class=\"tf-eyebrow\">Body · everything else<\u002Fdiv>\n      <div class=\"tf-name\" style=\"font-family:'Inter',sans-serif;font-weight:600;color:#ffffff;\">Inter<\u002Fdiv>\n      <div class=\"tf-spec\"><span>Weights: 400 · 500 · 600 · 700<\u002Fspan><span>License: OFL<\u002Fspan><\u002Fdiv>\n      <p>Inter is the workhorse for body, captions, navigation, labels, calls-to-action. If a piece of text is not display-scale, it is set in Inter.<\u002Fp>\n      <div class=\"tf-sample\">\n        <p style=\"font-family:Inter;font-size:18px;line-height:1.5;font-weight:400;margin:0 0 12px;color:var(--fg-secondary)\">Nivoda connects independent jewelers with trusted suppliers across 50+ countries. Every stone comes with full certification, transparent pricing, and personal service.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"tf\">\n      <div class=\"tf-eyebrow\" style=\"font-family: &quot;JetBrains Mono&quot;\">Mono · technical only<\u002Fdiv>\n      <div class=\"tf-name\" style=\"font-family:'JetBrains Mono',monospace;font-weight:500;color:#ffffff;\">JetBrains Mono<\u002Fdiv>\n      <div class=\"tf-spec\"><span>Variable<\u002Fspan><span>License: OFL<\u002Fspan><\u002Fdiv>\n      <p>Reserved for code, certificate IDs, lot numbers, technical metadata on collateral. Don't use it for stylistic effect.<\u002Fp>\n      <div class=\"tf-sample\" style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--fg-secondary)\">GIA · 2196183751 &nbsp;·&nbsp; 1.21 ct &nbsp;·&nbsp; F / VS1<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- scale -->\n  <div class=\"type-scale\">\n    <h3 class=\"ts-h\">The scale<\u002Fh3>\n    <p class=\"ts-sub\">These are the <em>only<\u002Fem> sizes. If your brief calls for something between 30 and 36, pick one and adjust the layout.<\u002Fp>\n    <div class=\"ts-table\">\n      <div class=\"ts-row ts-row--head\"><span>Token<\u002Fspan><span>Size<\u002Fspan><span>Weight<\u002Fspan><span>Family<\u002Fspan><span class=\"ts-sample-h\">Sample<\u002Fspan><\u002Fdiv>\n      <div class=\"ts-row\"><span>display<\u002Fspan><span>48px<\u002Fspan><span>700<\u002Fspan><span>Serif<\u002Fspan><span class=\"ts-sample-c\" style=\"font-family:'Nanum Myeongjo';font-size:48px;font-weight:700;line-height:1.25\">Display<\u002Fspan><\u002Fdiv>\n      <div class=\"ts-row\"><span>h1<\u002Fspan><span>36px<\u002Fspan><span>600<\u002Fspan><span>Serif<\u002Fspan><span class=\"ts-sample-c\" style=\"font-family:'Nanum Myeongjo';font-size:36px;font-weight:600;line-height:1.25\">Heading 1<\u002Fspan><\u002Fdiv>\n      <div class=\"ts-row\"><span>h2<\u002Fspan><span>24px<\u002Fspan><span>600<\u002Fspan><span>Serif<\u002Fspan><span class=\"ts-sample-c\" style=\"font-family:'Nanum Myeongjo';font-size:24px;font-weight:600;line-height:1.25\">Heading 2<\u002Fspan><\u002Fdiv>\n      <div class=\"ts-row\"><span>h3<\u002Fspan><span>20px<\u002Fspan><span>500<\u002Fspan><span>Sans<\u002Fspan><span class=\"ts-sample-c\" style=\"font-family:Inter;font-size:20px;font-weight:500\">Heading 3<\u002Fspan><\u002Fdiv>\n      <div class=\"ts-row\"><span>body<\u002Fspan><span>16px<\u002Fspan><span>400<\u002Fspan><span>Sans<\u002Fspan><span class=\"ts-sample-c\" style=\"font-family:Inter;font-size:16px;font-weight:400\">Body — default reading text.<\u002Fspan><\u002Fdiv>\n      <div class=\"ts-row\"><span>small<\u002Fspan><span>14px<\u002Fspan><span>400<\u002Fspan><span>Sans<\u002Fspan><span class=\"ts-sample-c\" style=\"font-family:Inter;font-size:14px;font-weight:400\">Small body — captions, footnotes.<\u002Fspan><\u002Fdiv>\n      <div class=\"ts-row\"><span>label<\u002Fspan><span>12px<\u002Fspan><span>500<\u002Fspan><span>Sans<\u002Fspan><span class=\"ts-sample-c\" style=\"font-family:Inter;font-size:12px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase\">UPPERCASE LABEL<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"ts-note\">For large-format banners and stand backwalls, scale display upward — but maintain the relative ratios in this table. A 12-foot banner reading \"The marketplace trusted by jewelers\" at 1200pt is fine; setting it in 1200pt Inter is not.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 06 LAYOUT -->\n<section class=\"sec light-ctx\" id=\"layout\" data-sec=\"06\">\n  <div class=\"sec-head\">\n    <div class=\"sec-num\">06<\u002Fdiv>\n    <h2 class=\"sec-h\">Layout <em>generously spaced<\u002Fem><\u002Fh2>\n    <p class=\"sec-sub\">Generous whitespace is a brand signal. The system breathes — your work should too.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"layout-grid\">\n    <div class=\"lg-card\">\n      <h3>Spacing<\u002Fh3>\n      <p>4px base unit. Use only these steps for digital, and proportional equivalents for print: <code>4 · 8 · 12 · 16 · 20 · 24 · 32 · 40 · 48 · 64 · 80 · 96<\u002Fcode>.<\u002Fp>\n      <div class=\"sp-stack\">\n        <div class=\"sp-bar\" style=\"width:4px\"><\u002Fdiv><div class=\"sp-lbl\">4<\u002Fdiv>\n        <div class=\"sp-bar\" style=\"width:16px\"><\u002Fdiv><div class=\"sp-lbl\">16<\u002Fdiv>\n        <div class=\"sp-bar\" style=\"width:32px\"><\u002Fdiv><div class=\"sp-lbl\">32<\u002Fdiv>\n        <div class=\"sp-bar\" style=\"width:64px\"><\u002Fdiv><div class=\"sp-lbl\">64<\u002Fdiv>\n        <div class=\"sp-bar\" style=\"width:96px\"><\u002Fdiv><div class=\"sp-lbl\">96<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"lg-card\">\n      <h3>Radius — two values only<\u002Fh3>\n      <p>Cards are near-square (formal, content-focused). Buttons and inputs are pill-shaped (inviting, action-focused). Same interaction language; different visual register.<\u002Fp>\n      <div class=\"rad-row\">\n        <div class=\"rad-card\" style=\"border-radius:2px\">2px · cards<\u002Fdiv>\n        <div class=\"rad-pill\" style=\"border-radius:999px\">999px · buttons<\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"caveat\">No 4px, 8px, 12px corners. No \"soft\" rounding. Two values, period.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"lg-card lg-card--wide\">\n      <h3>Composition principles<\u002Fh3>\n      <ul class=\"prin-list\">\n        <li><strong>Anchor with a serif headline.<\u002Fstrong> Display Nanum Myeongjo, set tight, <em>italics permitted on a single emphasized word<\u002Fem> — see hero.<\u002Fli>\n        <li><strong>Pair with one supporting line in Inter.<\u002Fstrong> No more than one. Long body copy lives on a separate panel, not the hero.<\u002Fli>\n        <li><strong>Use whitespace as a frame.<\u002Fstrong> A banner with one third negative space at top reads as luxury. A banner crammed edge-to-edge reads as discount.<\u002Fli>\n        <li><strong>One photograph or none.<\u002Fstrong> Never collage. Photography is a single, full-bleed editorial image, or it is absent.<\u002Fli>\n        <li><strong>Logo lock-up sits in a corner.<\u002Fstrong> Top-left or bottom-right preferred. Never centered under a headline. Never repeated.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 07 VOICE -->\n<section class=\"sec light-ctx\" id=\"voice\" data-sec=\"07\">\n  <div class=\"sec-head\">\n    <div class=\"sec-num\">07<\u002Fdiv>\n    <h2 class=\"sec-h\">Voice <em>quiet, precise, useful<\u002Fem><\u002Fh2>\n    <p class=\"sec-sub\">You will be writing short copy for banners, signage, lanyards, and giveaways. Get the register right or the design fails regardless of layout.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"voice-grid\">\n    <div class=\"voice-card\">\n      <h3>Confident, professional, warm<\u002Fh3>\n      <p>Three pillars at once: human (approachable), luxury (restrained), fintech (trustworthy). Never hyperbolic. Never generic. Never promotional.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"voice-card\">\n      <h3>Sentence case everywhere<\u002Fh3>\n      <p>Headings, buttons, tabs — all sentence case. <em>\"Visit us at booth B-42\"<\u002Fem>, not <em>\"Visit Us At Booth B-42\"<\u002Fem>. The only Title Case is product names: Nivoda Express, Nivoda Credit.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"voice-card\">\n      <h3>American English<\u002Fh3>\n      <p>Color, jeweler, organization, program. Oxford comma. Contractions are fine in marketing copy.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"voice-card\">\n      <h3>No exclamation marks<\u002Fh3>\n      <p>Not on signage. Not on banners. Not on giveaways. The brand does not shout. Question marks are reserved for genuine prompts (<em>\"Want to see how memo works?\"<\u002Fem>).<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"taglines\">\n    <h3 class=\"tg-h\">Approved taglines<\u002Fh3>\n    <p class=\"tg-sub\">Two only. Use them as written — never paraphrase, never invent a third for a single piece. If neither fits the moment, the moment doesn't need a tagline.<\u002Fp>\n    <div class=\"tg-grid\">\n      <div class=\"tg-card\">\n        <div class=\"tg-eyebrow\">Brand line · evergreen<\u002Fdiv>\n        <p class=\"tg-line\">Your partner in brilliance.<\u002Fp>\n        <p class=\"tg-use\">For brand-led surfaces — backwall headlines, hero banners, the cover of any printed piece. Pairs naturally with a single-image composition; do not use as a button label, sub-headline, or social caption.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tg-card\">\n        <div class=\"tg-eyebrow\">Outcome line · commercial<\u002Fdiv>\n        <p class=\"tg-line\">Nivoda powered jewelers sell more.<\u002Fp>\n        <p class=\"tg-use\">For commercial surfaces aimed at independent jewelers — sales sheets, tradeshow flyers, retailer-facing one-pagers. Sentence-level only; do not turn it into a headline at display scale.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"voice-samples\">\n    <h3 class=\"vs-h\">Conference copy — yes / no<\u002Fh3>\n    <div class=\"vs-row\">\n      <div class=\"vs vs--yes\"><div class=\"vs-tag\">Yes<\u002Fdiv><p>The marketplace trusted by the world's jewelers.<\u002Fp><\u002Fdiv>\n      <div class=\"vs vs--no\"><div class=\"vs-tag\">No<\u002Fdiv><p>The #1 marketplace jewelers love!<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"vs-row\">\n      <div class=\"vs vs--yes\"><div class=\"vs-tag\">Yes<\u002Fdiv><p>Memo with confidence. Try before you buy.<\u002Fp><\u002Fdiv>\n      <div class=\"vs vs--no\"><div class=\"vs-tag\">No<\u002Fdiv><p>Game-changing memo solutions for the modern jeweler!<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"vs-row\">\n      <div class=\"vs vs--yes\"><div class=\"vs-tag\">Yes<\u002Fdiv><p>Find us at booth B-42, Hall C.<\u002Fp><\u002Fdiv>\n      <div class=\"vs vs--no\"><div class=\"vs-tag\">No<\u002Fdiv><p>COME SEE US AT JCK!! 🎉<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"terms\">\n    <h3>Use these terms<\u002Fh3>\n    <div class=\"terms-grid\">\n      <div><span class=\"t-yes\">memo<\u002Fspan><span class=\"t-no\">consignment, loan<\u002Fspan><\u002Fdiv>\n      <div><span class=\"t-yes\">supplier<\u002Fspan><span class=\"t-no\">vendor, seller<\u002Fspan><\u002Fdiv>\n      <div><span class=\"t-yes\">jeweler / buyer<\u002Fspan><span class=\"t-no\">customer, user<\u002Fspan><\u002Fdiv>\n      <div><span class=\"t-yes\">stone, diamond<\u002Fspan><span class=\"t-no\">product, item<\u002Fspan><\u002Fdiv>\n      <div><span class=\"t-yes\">certified<\u002Fspan><span class=\"t-no\">verified, authenticated<\u002Fspan><\u002Fdiv>\n      <div><span class=\"t-yes\">order<\u002Fspan><span class=\"t-no\">purchase, transaction<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 08 APPLICATIONS -->\n<section class=\"sec\" id=\"applications\" data-sec=\"08\">\n  <div class=\"sec-head\">\n    <div class=\"sec-num\">08<\u002Fdiv>\n    <h2 class=\"sec-h\">Applications <em>in context<\u002Fem><\u002Fh2>\n    <p class=\"sec-sub\">Worked examples. These are <em>compositional references<\u002Fem>, not finished art — they show the system applied to the formats you'll be producing. Sketch your own; don't copy these.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- Banner: vertical pull-up -->\n  <div class=\"app-block\">\n    <div class=\"app-meta\">\n      <div class=\"app-num\">A<\u002Fdiv>\n      <div>\n        <h3>Vertical pull-up banner<\u002Fh3>\n        <p>850 × 2000 mm typical · single sided · 200 dpi at final size · 5 mm bleed all sides.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"app-stage app-stage--pullup\">\n      <div class=\"pullup\">\n        <div class=\"pullup-logo\"><img src=\"512ade26-8dc3-4b1b-9cc1-77e984ad55f7\" alt=\"\"><\u002Fdiv>\n        <div class=\"pullup-headline\">The marketplace<br><em>trusted by<br>jewelers.<\u002Fem><\u002Fdiv>\n        <div class=\"pullup-sub\">Diamonds and jewelry from 50+ countries. Certified. Transparent. Yours on memo.<\u002Fdiv>\n        <div class=\"pullup-foot\">\n          <div class=\"pf-l\">Booth B-42 · JCK Las Vegas<\u002Fdiv>\n          <div class=\"pf-r\">nivoda.com<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <ul class=\"app-notes\">\n      <li>Display headline in Nanum Myeongjo, ~140pt at final size, italic on the emphasized word.<\u002Fli>\n      <li>Logo top-left, locked at 25% panel width with 32mm clear space.<\u002Fli>\n      <li>Soft-black background — no gradient, no texture.<\u002Fli>\n      <li>Bottom strip carries booth + URL only. No QR code unless requested by the booth team.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <!-- Banner: horizontal -->\n  <div class=\"app-block\">\n    <div class=\"app-meta\">\n      <div class=\"app-num\">B<\u002Fdiv>\n      <div>\n        <h3>Horizontal stand backwall<\u002Fh3>\n        <p>3000 × 2400 mm typical · tiled panels · single full-bleed photograph + lock-up.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"app-stage\">\n      <div class=\"backwall\">\n        <div class=\"bw-photo\"><\u002Fdiv>\n        <div class=\"bw-scrim\"><\u002Fdiv>\n        <div class=\"bw-content\">\n          <div class=\"bw-eyebrow\" style=\"font-family: &quot;JetBrains Mono&quot;\">NIVODA AT JCK 2026<\u002Fdiv>\n          <div class=\"bw-headline\">Diamonds on <em style=\"color: rgb(255, 255, 255)\">terms<\u002Fem><br>that <i style=\"color: rgb(152, 134, 255)\">move with you<\u002Fi><\u002Fdiv>\n          <div class=\"bw-foot\" style=\"height: 60px\">\n            <img src=\"512ade26-8dc3-4b1b-9cc1-77e984ad55f7\" class=\"bw-logo\" alt=\"\">\n            <span class=\"bw-booth\" style=\"font-family: &quot;JetBrains Mono&quot;\">Booth B-42 · Hall C<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <ul class=\"app-notes\">\n      <li>Photography is full-bleed, with a <code>rgba(0,0,0,0.45)<\u002Fcode> dark scrim over the bottom two thirds.<\u002Fli>\n      <li>Headline left-aligned, anchored to a vertical thirds line. Italic emphasis on a single noun.<\u002Fli>\n      <li>Logo bottom-left, booth info typeset in Inter Medium, uppercase, with letter-spacing.<\u002Fli>\n      <li>No violet anywhere on this surface. Dark context, white interaction color.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <!-- Bifold leave-behind -->\n  <div class=\"app-block\">\n    <div class=\"app-meta\">\n      <div class=\"app-num\">C<\u002Fdiv>\n      <div>\n        <h3>Bifold leave-behind · light context<\u002Fh3>\n        <p>The piece a buyer takes back to their hotel and reads on the flight home. <strong>This is where violet lives.<\u002Fstrong> Light surfaces give violet permission to appear — but still only on accents: a thin rule under the headline, the arrow on the call-to-action, never as a fill.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"app-stage app-stage--bifold\">\n      <div class=\"bifold-spread\">\n        <div class=\"bf-piece\">\n          <div class=\"bf-piece-meta\">Cover · 148 mm<\u002Fdiv>\n          <div class=\"pc-stage bf-cover\">\n            <div class=\"bf-eyebrow\">A field guide for jewelers<\u002Fdiv>\n            <div class=\"bf-headline-lg\">Buying diamonds<br><em>on terms<\u002Fem><\u002Fdiv>\n            <div class=\"bf-foot\" style=\"border-style: none\">\n              <img src=\"b6db2296-0fc1-436b-8478-7d799102254a\" alt=\"\">\n              <span style=\"text-align: right\">JCK 2026<br>Booth B-42<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"bf-piece bf-piece--spread\">\n          <div class=\"bf-piece-meta\">Interior spread · 296 mm<\u002Fdiv>\n          <div class=\"pc-stage bf-inside\" style=\"font-weight: 500\">\n            <div class=\"bi-col\">\n              <div class=\"bi-eyebrow\">01 · Memo<\u002Fdiv>\n              <div class=\"bi-h\">Hold the stone before you commit to it<\u002Fdiv>\n              <p class=\"bi-p\">Receive certified diamonds on memo from suppliers in 50+ countries. Show your client. Decide after. Pay for what you keep — return the rest, no questions, no hidden fees.<\u002Fp>\n              <div class=\"bi-stat\" style=\"border-style: none\"><span class=\"bi-stat-num\">14 days<\u002Fspan><span class=\"bi-stat-lbl\" style=\"font-family: &quot;JetBrains Mono&quot;\">standard<\u002Fspan><\u002Fdiv>\n              <div class=\"bi-cta\" style=\"border-style: none\">Open a memo<br>account <span class=\"bi-arrow\">→<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"bi-col\">\n              <div class=\"bi-eyebrow\">02 · Credit<\u002Fdiv>\n              <div class=\"bi-h\">Working capital, sized for independents<\u002Fdiv>\n              <p class=\"bi-p\">Apply once. Transact across the marketplace with 30 to 90 day terms. Designed for jewelers running a single shop, not corporate procurement.<\u002Fp>\n              <div class=\"bi-stat\" style=\"border-style: none\"><span class=\"bi-stat-num\">90 days<\u002Fspan><span class=\"bi-stat-lbl\" style=\"font-family: &quot;JetBrains Mono&quot;\">maximum payment terms<\u002Fspan><\u002Fdiv>\n              <div class=\"bi-cta\" style=\"border-style: none\">Pre-qualify in 6 minutes <span class=\"bi-arrow\">→<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <aside class=\"bf-spec\">\n        <div class=\"bf-spec-h\">Production specification<\u002Fdiv>\n        <dl class=\"bf-spec-list\">\n          <dt>Format<\u002Fdt><dd>A5 bifold · 148 × 210 mm closed · 296 × 210 mm open<\u002Fdd>\n          <dt>Fold<\u002Fdt><dd>Single half-fold, scored before folding<\u002Fdd>\n          <dt>Stock<\u002Fdt><dd>Mohawk Superfine Eggshell · 270 gsm · uncoated<\u002Fdd>\n          <dt>Ink<\u002Fdt><dd>4-colour process · soft black built as <code>40·30·30·100<\u002Fcode>, not <code>K100<\u002Fcode><\u002Fdd>\n          <dt>Spot accent<\u002Fdt><dd>Violet-600 <code>#6330F5<\u002Fcode> as Pantone 2098 C, single hit, kiss-cut to the rule and arrow only<\u002Fdd>\n          <dt>Finish<\u002Fdt><dd>Soft-touch laminate on cover only · interior left raw to keep the paper texture<\u002Fdd>\n          <dt>Bleed / safe<\u002Fdt><dd>3 mm bleed all sides · 8 mm interior safe area from fold<\u002Fdd>\n          <dt>Quantity<\u002Fdt><dd>2,500 units · split delivery: 1,500 to JCK Las Vegas, balance to London<\u002Fdd>\n        <\u002Fdl>\n        <div class=\"bf-spec-note\">\n          <strong>Print partner<\u002Fstrong> Generation Press, Sussex. Brief them through brand@nivoda.com— they hold the soft-black build and the Pantone match on file.\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n\n    <ul class=\"app-notes\">\n      <li>Headline is Nanum Myeongjo at 84pt with one italicised phrase (\"on terms\") carrying the emphasis. No subhead under it — the silence is the design.<\u002Fli>\n      <li>Interior copy is two parallel modules — same length, same shape, same call-to-action structure. The discipline of the symmetry is the brand expression.<\u002Fli>\n      <li>The violet accents print as a kiss-cut spot colour, not as part of the CMYK build. This is the only piece in the conference run that gets a spot pass — budget accordingly.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 09 DON'TS -->\n<section class=\"sec light-ctx\" id=\"donts\" data-sec=\"09\">\n  <div class=\"sec-head\">\n    <div class=\"sec-num\">09<\u002Fdiv>\n    <h2 class=\"sec-h\">Don't <em>ever<\u002Fem><\u002Fh2>\n    <p class=\"sec-sub\">A short list of behaviors that will fail review automatically.<\u002Fp>\n  <\u002Fdiv>\n\n  <ol class=\"never-list\">\n    <li><strong>Don't mix violet tiers across surfaces.<\u002Fstrong> Use <code>violet-400<\u002Fcode> on dark, <code>violet-600<\u002Fcode> on light. Never <code>violet-600<\u002Fcode> on a soft-black banner — it vibrates. Never <code>violet-400<\u002Fcode> on white — it disappears.<\u002Fli>\n    <li><strong>Never use pure black <code>#000<\u002Fcode>.<\u002Fstrong> The brand black is <code>#0c0a09<\u002Fcode> — soft black. The difference is small on screen and obvious in print.<\u002Fli>\n    <li><strong>Never use gradients.<\u002Fstrong> No mesh gradients, no purple-to-pink, no metallic effects. Solid fills only.<\u002Fli>\n    <li><strong>Never use emoji.<\u002Fstrong> Anywhere. Including social copy, lanyard text, signage, and \"fun\" giveaways.<\u002Fli>\n    <li><strong>Never use exclamation marks<\u002Fstrong> in product, signage, or banner copy.<\u002Fli>\n    <li><strong>Never use a font that isn't Nanum Myeongjo, Inter, or JetBrains Mono.<\u002Fstrong> Not for \"just one word.\" Not for \"the heading needed character.\"<\u002Fli>\n    <li><strong>Never use radii other than 2px (cards) or 999px (buttons / inputs).<\u002Fstrong> No 4px softening. No 12px friendliness.<\u002Fli>\n    <li><strong>Never recreate the logo.<\u002Fstrong> Use the canonical SVG. If you need a wider clear-area, frame the file with whitespace; don't redraw it.<\u002Fli>\n    <li><strong>Never use stock photography<\u002Fstrong> or generic AI imagery without scrim and review. Sterile bright shots fail the brand register.<\u002Fli>\n    <li><strong>Never float a white card on a dark background.<\u002Fstrong> If you need a light surface, build a dedicated light section. Don't island a white tile in a dark layout.<\u002Fli>\n    <li><strong>Never use Title Case on UI labels or headings.<\u002Fstrong> Sentence case. Always.<\u002Fli>\n    <li><strong>Never improvise where the brand has a gap.<\u002Fstrong> Flag it. Wait for Chris.<\u002Fli>\n  <\u002Fol>\n<\u002Fsection>\n\n<!-- 10 DELIVERABLES -->\n<section class=\"sec\" id=\"deliverables\" data-sec=\"10\">\n  <div class=\"sec-head\">\n    <div class=\"sec-num\">10<\u002Fdiv>\n    <h2 class=\"sec-h\">Deliverables &amp; <em>specs<\u002Fem><\u002Fh2>\n    <p class=\"sec-sub\">What we expect to receive, in what formats, by when.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"deliv-grid\">\n    <div class=\"deliv\">\n      <div class=\"deliv-head\"><div class=\"deliv-num\">D1<\u002Fdiv><h3>Banners<\u002Fh3><\u002Fdiv>\n      <ul>\n        <li>Vertical pull-ups: 850 × 2000 mm, 5 mm bleed, 200 dpi.<\u002Fli>\n        <li>Backwall panels: supplied at final dimensions, 150 dpi, tiled per stand spec.<\u002Fli>\n        <li>Working files in InDesign or Figma + final flattened PDF/X-4.<\u002Fli>\n        <li>Embed all fonts. Convert text to outlines on supplied print PDFs.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"deliv\">\n      <div class=\"deliv-head\"><div class=\"deliv-num\">D2<\u002Fdiv><h3>Print collateral<\u002Fh3><\u002Fdiv>\n      <ul>\n        <li>Bifold leave-behind: A5 closed (148 × 210 mm), 270 gsm uncoated, CMYK + violet-600 spot.<\u002Fli>\n        <li>3 mm bleed all sides, 8 mm interior safe area from fold.<\u002Fli>\n        <li>Working files in InDesign + final flattened PDF/X-4 with violet on its own kiss-cut spot layer.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"deliv\">\n      <div class=\"deliv-head\"><div class=\"deliv-num\">D3<\u002Fdiv><h3>Digital signage<\u002Fh3><\u002Fdiv>\n      <ul>\n        <li>16:9 and 9:16 master compositions, 1920 × 1080 / 1080 × 1920.<\u002Fli>\n        <li>MP4 (H.264) for animated; PNG for static.<\u002Fli>\n        <li>No motion outside subtle 0.2s transitions. No hero video.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"timeline\">\n    <h3>Review checkpoints<\u002Fh3>\n    <ol class=\"tl\">\n      <li><span class=\"tl-day\">Day 0<\u002Fspan><span class=\"tl-bar\"><\u002Fspan><span class=\"tl-step\">Brief signed off · designer onboarded<\u002Fspan><\u002Fli>\n      <li><span class=\"tl-day\">+ 5 days<\u002Fspan><span class=\"tl-bar\"><\u002Fspan><span class=\"tl-step\">First sketches · 3 routes per format<\u002Fspan><\u002Fli>\n      <li><span class=\"tl-day\">+ 10 days<\u002Fspan><span class=\"tl-bar\"><\u002Fspan><span class=\"tl-step\">Chosen route · 1 round of refinement<\u002Fspan><\u002Fli>\n      <li><span class=\"tl-day\">+ 14 days<\u002Fspan><span class=\"tl-bar\"><\u002Fspan><span class=\"tl-step\">Print proofs · physical sign-off with Chris<\u002Fspan><\u002Fli>\n      <li><span class=\"tl-day\">+ 18 days<\u002Fspan><span class=\"tl-bar\"><\u002Fspan><span class=\"tl-step\">Production files delivered to vendor<\u002Fspan><\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 11 CONTACT -->\n<section class=\"sec light-ctx\" id=\"contact\" data-sec=\"11\">\n  <div class=\"sec-head\">\n    <div class=\"sec-num\">11<\u002Fdiv>\n    <h2 class=\"sec-h\">Contact &amp; <em>asset access<\u002Fem><\u002Fh2>\n  <\u002Fdiv>\n\n  <div class=\"contact-grid\">\n    <div class=\"contact-card\">\n      <div class=\"cc-eyebrow\" style=\"font-family: 'JetBrains Mono', monospace; text-transform: uppercase\">Brand owner — sign-off<\u002Fdiv>\n      <div class=\"cc-name\" style=\"height: 50px\">Chris Learey<\u002Fdiv>\n      <div class=\"cc-role\" style=\"font-family: Inter; height: 18px\">Design Lead, Nivoda<\u002Fdiv>\n      <div class=\"cc-meta\" style=\"font-family: Inter; font-size: 14px; font-weight: 400; height: 18px\">chris@nivoda.com<\u002Fdiv>\n      <p style=\"font-size: 10px\">Final sign-off on every piece of brand expression. Loop in early; don't surface a finished file.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"contact-card\">\n      <div class=\"cc-eyebrow\" style=\"font-family: 'JetBrains Mono', monospace; text-transform: uppercase\">Day-to-day partner<\u002Fdiv>\n      <div class=\"cc-name\" style=\"height: 50px\">Brand &amp; Marketing team<\u002Fdiv>\n      <div class=\"cc-role\" style=\"font-family: Inter\">brand@nivoda.com<\u002Fdiv>\n      <div class=\"cc-meta\" style=\"font-family: Inter; font-size: 14px; font-weight: 400\">Slack channel #brand-events<\u002Fdiv>\n      <p style=\"font-size: 10px\">Briefs, asset requests, copy review, vendor coordination, JCK logistics.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"contact-card\">\n      <div class=\"cc-eyebrow\" style=\"font-family: 'JetBrains Mono', monospace; text-transform: uppercase\">Asset library<\u002Fdiv>\n      <div class=\"cc-name\" style=\"height: 50px\">Brand drive<\u002Fdiv>\n      <div class=\"cc-role\" style=\"font-family: Inter\">drive.nivoda.com/brand<\u002Fdiv>\n      <div class=\"cc-meta\" style=\"font-family: Inter; font-size: 14px; font-weight: 400\">Logos · fonts · photography · this document<\u002Fdiv>\n      <p style=\"font-size: 10px\">Always pull the canonical assets from the drive. Don't archive your own copy and reuse next year.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"gap-note\">\n    <div class=\"gap-mark\">!<\u002Fdiv>\n    <div>\n      <h3>Brand gaps you'll bump into<\u002Fh3>\n      <p>The system is mature, but a few areas are explicitly unfinished. Don't improvise — flag and wait:<\u002Fp>\n      <ul>\n        <li><strong>Press &amp; focus states.<\u002Fstrong> Not formally defined; reasonable defaults exist but anything brand-critical needs Chris's call.<\u002Fli>\n        <li><strong>Co-branding rules.<\u002Fstrong> Partner-logo lock-ups need approval per instance.<\u002Fli>\n        <li><strong>Voice principles document.<\u002Fstrong> The full voice guide is scaffolded but unfinished. Use the samples in §08 as your reference, and ask if a piece of copy doesn't fit them.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <footer class=\"doc-foot\">\n    <div class=\"df-l\">\n      <img src=\"b6db2296-0fc1-436b-8478-7d799102254a\" alt=\"Nivoda\">\n    <\u002Fdiv>\n    <div class=\"df-r\">\n      <p>Nivoda · The global B2B marketplace for diamonds and jewelry.<\u002Fp>\n      <p class=\"df-meta\" style=\"font-size: 51px\">Conference brand handoff · Rev 01 · April 2026 · Internal use, designer NDA applies.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<script src=\"5a21d3ab-1ad5-46c4-a72c-2304e5dc7567\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
