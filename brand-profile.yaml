# Brand Profile — Nivoda
# Generated by /brand-builder on 2026-05-07
# Used by /post and /announce for content generation
# NOTE: Voice principles and application rules are partially scaffolded in docs/
# pending full content from the design lead (Chris Learey).

product:
  name: Nivoda
  domain: nivoda.com
  tagline: "Your partner in brilliance"
  category: diamond-marketplace

audience:
  primary: "B2B diamond trade — jewellery retailers, wholesalers, and manufacturers sourcing diamonds and gemstones at trade level"
  demographics:
    - Jewellery retailers (independent and chain)
    - Wholesale diamond dealers
    - Jewellery manufacturers
    - Trade buyers globally
  pain_points:
    - Fragmented, opaque diamond supply chains
    - Slow, relationship-dependent sourcing
    - Lack of pricing transparency across suppliers
    - Time and cost of attending trade shows to see stock

voice:
  tone: warm_relational
  personality:
    - Human and personal — we're a partner, not a platform
    - Confident without being cold — we know the trade deeply
    - Elevated and restrained — luxury-adjacent, never shouty
    - Precise where it matters — specs, certs, and prices are exact
  avoid:
    - Corporate jargon and hollow buzzwords
    - Overpromising or superlatives ("best", "revolutionary")
    - Cold, transactional language — no robot voice
    - Consumer-facing luxury language (save that for jewellers' end customers)

visual:
  primary_color: "#6330f5"        # violet-600
  dark_accent: "#4b2bb8"          # violet-700
  light_surface: "#f4f2ff"        # violet-50
  text_primary: "#0c0a09"         # stone-950
  text_secondary: "#57534e"       # stone-600
  headline_font: "Nanum Myeongjo"
  body_font: "Inter"
  imagery_style: "Moody, cinematic, high-end editorial. Real people, shallow depth of field, warm lighting."

content:
  mix:
    product_updates: 20%
    industry_intelligence: 50%
    trade_education: 20%
    company_and_culture: 10%

  topics:
    # Industry & market intelligence (50%)
    - Diamond price movements and market trends
    - Supply chain news (rough diamond auctions, mining updates)
    - Trade show coverage (JCK Las Vegas, Basel, Hong Kong)
    - Certification and grading standards news (GIA, IGI, HRD)

    # Trade education (20%)
    - How to source smarter on Nivoda
    - Diamond grading and spec literacy
    - Understanding diamond pricing and value

    # Product & platform (20%)
    - New marketplace features and supplier additions
    - Inventory and network milestones
    - Platform improvements and tools

    # Company & culture (10%)
    - Team and mission stories
    - Milestones and growth markers
    - Behind-the-scenes at Nivoda

  posting_frequency: "2–3 times per week"

inspirations:
  - "Net-a-Porter — elevated luxury retail, editorial curation, restrained sophistication"
  - "Stripe — precise, confident, infrastructure that just works"

context:
  category: "B2B marketplace / fintech infrastructure"
  brand_direction: "Human + local + relational ∩ Luxury marketplace ∩ Fintech backbone"
  brand_gaps:
    - "Logo usage rules (minimum clear space, minimum size) — awaiting Chris"
    - "Voice principles with worked examples — awaiting Chris"
    - "Application rules (co-branding, email limits) — awaiting Chris"
    - "Company tagline — resolved: 'Your partner in brilliance'"
  key_docs:
    - "docs/visual-identity.md        # all visual primitives — authoritative"
    - "docs/voice-and-tone.md         # scaffolded, awaiting examples"
    - "docs/brand-application-rules.md  # scaffolded, awaiting examples"
